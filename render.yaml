# Render Blueprint — deploys backend API + PostgreSQL database together.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: linguaquest-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: linguaquest-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true          # Render auto-generates a secure random secret
      - key: CORS_ORIGINS
        value: https://linguaquest.vercel.app,http://localhost:3000
      - key: ENVIRONMENT
        value: production
      - key: REDIS_URL
        value: ""                    # Redis optional — app degrades gracefully without it

databases:
  - name: linguaquest-db
    plan: free                       # Free 1 GB PostgreSQL on Render
    databaseName: linguaquest
    user: linguaquest
